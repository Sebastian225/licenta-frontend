<mat-drawer-container class="container mat-typography" autosize>
    <mat-drawer #drawer mode="side" disableClose="true" opened="true" class="menu-wrapper">
        <app-side-menu (onMenuExpanded)="isMenuExpanded = $event"></app-side-menu>
    </mat-drawer>
  
    <mat-drawer-content class="page-wrapper" [class.menu-expanded]="isMenuExpanded">
        <router-outlet></router-outlet>
    </mat-drawer-content>
</mat-drawer-container>
